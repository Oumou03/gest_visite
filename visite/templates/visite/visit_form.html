{% extends "visite/base.html" %}

{% block content %}
<div class="max-w-2xl mx-auto bg-white rounded-xl shadow-md overflow-hidden">
    <div class="p-8">
        <h2 class="text-2xl font-bold text-gray-800 mb-6">{{ title }}</h2>
        <form method="POST">
            {% csrf_token %}
            <div class="space-y-4">
                {{ form.as_p }}
            </div>
            <div class="mt-8 flex gap-4">
                <button type="submit" class="flex-1 bg-blue-600 text-white py-2 rounded-lg font-bold hover:bg-blue-700">Enregistrer</button>
                <a href="{% url 'dashboard' %}" class="flex-1 text-center bg-gray-100 text-gray-600 py-2 rounded-lg font-bold hover:bg-gray-200">Annuler</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
